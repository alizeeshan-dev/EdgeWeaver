[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeweaver"
version = "0.1.0"
description = "Local research prototype for simulated edge-inference scheduling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "pydantic>=2.8,<3",
    "PyYAML>=6,<7",
    "scikit-learn>=1.6,<2",
    "simpy>=4.1,<5",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
edgeweaver-fixture = "edgeweaver.cli:main"

[tool.setuptools.packages.find]
include = ["api*", "edgeweaver*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["joblib", "sklearn.*"]
ignore_missing_imports = true
