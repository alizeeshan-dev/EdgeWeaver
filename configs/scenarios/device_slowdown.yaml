scenario_id: device_slowdown
description: Moderately high arrivals while edge-server service slows mid-run and later recovers.
simulation_duration_ms: 20000.0
random_seed: 42
arrival:
  base_rate_per_second: 5.0
  bursts: []
deadline_distribution:
  values_ms: [100.0, 180.0, 300.0]
  weights: [0.20, 0.45, 0.35]
minimum_accuracy_distribution:
  values: [0.90, 0.93, 0.95]
  weights: [0.45, 0.35, 0.20]
request_input:
  source_device_id: mobile
  size_mode: dataset_row
device_slowdown:
  device_id: edge-server
  start_time_ms: 7000.0
  end_time_ms: 14000.0
  service_time_multiplier: 3.0
